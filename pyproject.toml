[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbench-replay"
version = "0.5.1"
description = "Reproducible offline prompt and model benchmarking with explicit judges."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "vigilanty0x"}]
keywords = ["prompts", "models", "benchmark", "evaluation", "replay", "promptops", "regression", "routing", "verification", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
promptbench = "promptbench.cli:main"
promptops = "promptbench.ops_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
