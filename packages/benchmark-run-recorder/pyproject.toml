[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-run-recorder"
version = "0.1.0"
description = "Record bounded caller-supplied benchmark metrics and artifact digests."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
benchmark-run-recorder = "benchmark_run_recorder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
