[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-dataset-builder"
version = "0.1.0"
description = "Canonical synthetic evaluation datasets with deterministic splits."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
eval-dataset-builder = "eval_dataset_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

