name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python scripts/check.py
      - run: python scripts/check_release_metadata.py
      - run: python scripts/check_python_support.py
      - run: python scripts/check_workflow_security.py
      - run: python scripts/check_portfolio_compat.py
      - run: python -m unittest discover -s tests -v
      - run: promptbench validate --suite examples/suite.json
      - run: promptbench probe --level functional
      - run: promptbench demo --workspace /tmp/promptbench-demo
      - name: Build root wheel twice
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/wheel-rebuild
      - name: Verify root wheel is reproducible
        run: |
          test "$(find /tmp/wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find /tmp/wheel-rebuild -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          primary_sha="$(sha256sum /tmp/wheel/*.whl | awk '{print $1}')"
          rebuild_sha="$(sha256sum /tmp/wheel-rebuild/*.whl | awk '{print $1}')"
          echo "primary_sha=$primary_sha"
          echo "rebuild_sha=$rebuild_sha"
          test "$primary_sha" = "$rebuild_sha"
      - name: Smoke-test root wheel in clean venv
        run: |
          python -m venv /tmp/root-wheel-smoke
          /tmp/root-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps /tmp/wheel/*.whl
          /tmp/root-wheel-smoke/bin/python -c "import importlib.metadata as m, promptbench; assert m.version('promptbench-replay') == promptbench.__version__"
          /tmp/root-wheel-smoke/bin/promptbench --help >/dev/null
          /tmp/root-wheel-smoke/bin/promptbench probe --level liveness >/dev/null
          /tmp/root-wheel-smoke/bin/promptops --help >/dev/null
      - name: Upload root wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptbench-replay-wheel-py${{ matrix.python-version }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 14

  verify-consolidated-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package:
          - answer-diff
          - benchmark-run-recorder
          - consensus-engine
          - eval-dataset-builder
          - llm-jury
          - model-scorecard
          - multi-agent-failure-corpus
          - prompt-package-manager
          - prompt-regression
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e "packages/${{ matrix.package }}"
      - name: Run package static checks
        run: python "packages/${{ matrix.package }}/scripts/check.py"
      - name: Run package tests
        run: python -m unittest discover -s "packages/${{ matrix.package }}/tests" -v
      - name: Build package wheel twice
        run: |
          python -m pip wheel "packages/${{ matrix.package }}" --no-deps --wheel-dir /tmp/wheel
          python -m pip wheel "packages/${{ matrix.package }}" --no-deps --wheel-dir /tmp/wheel-rebuild
      - name: Verify package wheel is reproducible
        run: |
          test "$(find /tmp/wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find /tmp/wheel-rebuild -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          primary_sha="$(sha256sum /tmp/wheel/*.whl | awk '{print $1}')"
          rebuild_sha="$(sha256sum /tmp/wheel-rebuild/*.whl | awk '{print $1}')"
          echo "primary_sha=$primary_sha"
          echo "rebuild_sha=$rebuild_sha"
          test "$primary_sha" = "$rebuild_sha"
      - name: Smoke-test package wheel against portfolio contract
        env:
          PACKAGE_PATH_NAME: ${{ matrix.package }}
        run: |
          python -m venv /tmp/package-wheel-smoke
          /tmp/package-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps /tmp/wheel/*.whl
          /tmp/package-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path
          import sys

          package_path_name = os.environ["PACKAGE_PATH_NAME"]
          manifest = json.loads(Path("portfolio-compatibility.v1.json").read_text(encoding="utf-8"))
          canonical_path = f"packages/{package_path_name}"
          matches = [item for item in manifest["packages"] if item.get("canonical_path") == canonical_path]
          assert len(matches) == 1, f"expected one portfolio manifest row for {canonical_path!r}; found {len(matches)}"
          contract = matches[0]
          distribution_name = contract["distribution"]
          expected_version = contract["version"]
          expected_cli = contract["cli"]

          distribution = metadata.distribution(distribution_name)
          assert distribution.version == expected_version, (
              f"installed {distribution_name!r} version {distribution.version!r} "
              f"does not match portfolio contract {expected_version!r}"
          )
          entry_points = [
              entry
              for entry in distribution.entry_points
              if entry.group == "console_scripts" and entry.name == expected_cli
          ]
          assert len(entry_points) == 1, (
              f"expected exactly one console script named {expected_cli!r} for {distribution_name!r}; "
              f"found {[entry.name for entry in distribution.entry_points if entry.group == 'console_scripts']}"
          )
          target = entry_points[0].load()
          assert callable(target), f"console script target for {expected_cli!r} is not callable"
          executable = Path(sys.prefix) / "bin" / expected_cli
          assert executable.is_file(), f"installed console script is missing: {executable}"
          PY
      - name: Upload package wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}-wheel-py${{ matrix.python-version }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 14
