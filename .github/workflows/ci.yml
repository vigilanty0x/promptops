name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python scripts/check.py
      - run: python scripts/check_release_metadata.py
      - run: python scripts/check_portfolio_compat.py
      - run: python -m unittest discover -s tests -v
      - run: promptbench validate --suite examples/suite.json
      - run: promptbench probe --level functional
      - run: promptbench demo --workspace /tmp/promptbench-demo
      - name: Build root wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheel
      - name: Smoke-test root wheel in clean venv
        run: |
          python -m venv /tmp/root-wheel-smoke
          /tmp/root-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps /tmp/wheel/*.whl
          /tmp/root-wheel-smoke/bin/python -c "import importlib.metadata as m, promptbench; assert m.version('promptbench-replay') == promptbench.__version__"
          /tmp/root-wheel-smoke/bin/promptbench --help >/dev/null
          /tmp/root-wheel-smoke/bin/promptbench probe --level liveness >/dev/null
          /tmp/root-wheel-smoke/bin/promptops --help >/dev/null
      - name: Upload root wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptbench-replay-wheel-py${{ matrix.python-version }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 14

  verify-consolidated-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package:
          - answer-diff
          - benchmark-run-recorder
          - consensus-engine
          - eval-dataset-builder
          - llm-jury
          - model-scorecard
          - multi-agent-failure-corpus
          - prompt-package-manager
          - prompt-regression
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e "packages/${{ matrix.package }}"
      - name: Run package static checks
        run: python "packages/${{ matrix.package }}/scripts/check.py"
      - name: Run package tests
        run: python -m unittest discover -s "packages/${{ matrix.package }}/tests" -v
      - name: Build package wheel
        run: python -m pip wheel "packages/${{ matrix.package }}" --no-deps --wheel-dir /tmp/wheel
      - name: Smoke-test package wheel in clean venv
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python -m venv /tmp/package-wheel-smoke
          /tmp/package-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps /tmp/wheel/*.whl
          /tmp/package-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path
          import sys

          package = os.environ["PACKAGE"]
          distribution = metadata.distribution(package)
          entry_points = [
              entry
              for entry in distribution.entry_points
              if entry.group == "console_scripts" and entry.name == package
          ]
          assert len(entry_points) == 1, (
              f"expected exactly one console script named {package!r}; "
              f"found {[entry.name for entry in distribution.entry_points if entry.group == 'console_scripts']}"
          )
          target = entry_points[0].load()
          assert callable(target), f"console script target for {package!r} is not callable"
          executable = Path(sys.prefix) / "bin" / package
          assert executable.is_file(), f"installed console script is missing: {executable}"
          PY
      - name: Upload package wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}-wheel-py${{ matrix.python-version }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 14
