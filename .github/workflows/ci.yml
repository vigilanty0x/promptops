name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python scripts/check.py
      - run: python scripts/check_release_metadata.py
      - run: python scripts/check_release_publish_policy.py
      - run: python scripts/check_python_support.py
      - run: python scripts/check_build_backend.py
      - run: python scripts/check_workflow_security.py
      - run: python scripts/check_governance_manifest.py
      - run: python scripts/check_portfolio_compat.py
      - run: python -m unittest discover -s tests -v
      - run: promptbench validate --suite examples/suite.json
      - run: promptbench probe --level functional
      - run: promptbench demo --workspace /tmp/promptbench-demo
      - name: Build root wheel twice
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/wheel-rebuild
      - name: Verify root wheel is reproducible
        run: |
          test "$(find /tmp/wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find /tmp/wheel-rebuild -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          primary_sha="$(sha256sum /tmp/wheel/*.whl | awk '{print $1}')"
          rebuild_sha="$(sha256sum /tmp/wheel-rebuild/*.whl | awk '{print $1}')"
          echo "primary_sha=$primary_sha"
          echo "rebuild_sha=$rebuild_sha"
          test "$primary_sha" = "$rebuild_sha"
      - name: Smoke-test root wheel in clean venv
        run: |
          python -m venv /tmp/root-wheel-smoke
          /tmp/root-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps /tmp/wheel/*.whl
          /tmp/root-wheel-smoke/bin/python -c "import importlib.metadata as m, promptbench; assert m.version('promptbench-replay') == promptbench.__version__"
          /tmp/root-wheel-smoke/bin/promptbench --help >/dev/null
          /tmp/root-wheel-smoke/bin/promptbench probe --level liveness >/dev/null
          /tmp/root-wheel-smoke/bin/promptops --help >/dev/null
      - name: Upload root wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promptbench-replay-wheel-py${{ matrix.python-version }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 14

  verify-consolidated-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package:
          - answer-diff
          - benchmark-run-recorder
          - consensus-engine
          - eval-dataset-builder
          - llm-jury
          - model-scorecard
          - multi-agent-failure-corpus
          - prompt-package-manager
          - prompt-regression
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e "packages/${{ matrix.package }}"
      - name: Run package static checks
        run: python "packages/${{ matrix.package }}/scripts/check.py"
      - name: Run package tests
        run: python -m unittest discover -s "packages/${{ matrix.package }}/tests" -v
      - name: Build package wheel twice
        run: |
          python -m pip wheel "packages/${{ matrix.package }}" --no-deps --wheel-dir /tmp/wheel
          python -m pip wheel "packages/${{ matrix.package }}" --no-deps --wheel-dir /tmp/wheel-rebuild
      - name: Verify package wheel is reproducible
        run: |
          test "$(find /tmp/wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find /tmp/wheel-rebuild -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          primary_sha="$(sha256sum /tmp/wheel/*.whl | awk '{print $1}')"
          rebuild_sha="$(sha256sum /tmp/wheel-rebuild/*.whl | awk '{print $1}')"
          echo "primary_sha=$primary_sha"
          echo "rebuild_sha=$rebuild_sha"
          test "$primary_sha" = "$rebuild_sha"
      - name: Smoke-test package wheel against portfolio contract
        env:
          PACKAGE_PATH_NAME: ${{ matrix.package }}
        run: |
          python -m venv /tmp/package-wheel-smoke
          /tmp/package-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps /tmp/wheel/*.whl
          /tmp/package-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path
          import sys

          package_path_name = os.environ["PACKAGE_PATH_NAME"]
          manifest = json.loads(Path("portfolio-compatibility.v1.json").read_text(encoding="utf-8"))
          canonical_path = f"packages/{package_path_name}"
          matches = [item for item in manifest["packages"] if item.get("canonical_path") == canonical_path]
          assert len(matches) == 1, f"expected one portfolio manifest row for {canonical_path!r}; found {len(matches)}"
          contract = matches[0]
          distribution_name = contract["distribution"]
          expected_version = contract["version"]
          expected_cli = contract["cli"]

          distribution = metadata.distribution(distribution_name)
          assert distribution.version == expected_version, (
              f"installed {distribution_name!r} version {distribution.version!r} "
              f"does not match portfolio contract {expected_version!r}"
          )
          entry_points = [
              entry
              for entry in distribution.entry_points
              if entry.group == "console_scripts" and entry.name == expected_cli
          ]
          assert len(entry_points) == 1, (
              f"expected exactly one console script named {expected_cli!r} for {distribution_name!r}; "
              f"found {[entry.name for entry in distribution.entry_points if entry.group == 'console_scripts']}"
          )
          target = entry_points[0].load()
          assert callable(target), f"console script target for {expected_cli!r} is not callable"
          executable = Path(sys.prefix) / "bin" / expected_cli
          assert executable.is_file(), f"installed console script is missing: {executable}"
          PY
      - name: Upload package wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}-wheel-py${{ matrix.python-version }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 14

  attest-wheels:
    needs: [verify, verify-consolidated-package]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner) || (github.event_name == 'pull_request' && github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download all verified wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheel-py*"
          path: /tmp/attest-input
          merge-multiple: false
          digest-mismatch: error
      - name: Prepare canonical wheel subjects
        run: |
          python - <<'PY'
          from collections import defaultdict
          from hashlib import sha256
          from pathlib import Path
          import shutil

          source = Path("/tmp/attest-input")
          target = Path("/tmp/attest-subjects")
          target.mkdir(parents=True, exist_ok=True)
          wheels = sorted(source.rglob("*.whl"))
          assert len(wheels) == 40, f"expected 40 downloaded wheel files; found {len(wheels)}"

          groups = defaultdict(list)
          for wheel in wheels:
              groups[wheel.name].append(wheel)
          assert len(groups) == 10, f"expected 10 canonical wheel names; found {len(groups)}"

          checksums = []
          for name, files in sorted(groups.items()):
              assert len(files) == 4, f"expected four Python-matrix copies for {name}; found {len(files)}"
              digests = []
              for path in files:
                  digests.append(sha256(path.read_bytes()).hexdigest())
              assert len(set(digests)) == 1, f"cross-Python wheel bytes differ for {name}: {digests}"
              shutil.copy2(files[0], target / name)
              checksums.append(f"{digests[0]}  {name}")

          (target / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          PY
      - name: Generate signed SLSA provenance
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: /tmp/attest-subjects/*.whl
      - name: Verify signed provenance policy
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          test "$(find /tmp/attest-subjects -maxdepth 1 -name '*.whl' | wc -l)" -eq 10
          gh attestation verify --help >/dev/null
          for wheel in /tmp/attest-subjects/*.whl; do
            gh attestation verify "$wheel" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$BUNDLE_PATH" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners >/dev/null
          done
      - name: Write provenance receipt
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": "1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": ".github/workflows/ci.yml",
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_digest": os.environ["GITHUB_SHA"],
              "runner_environment": os.environ.get("RUNNER_ENVIRONMENT"),
              "canonical_subject_count": 10,
              "attestation_id": os.environ.get("ATTESTATION_ID"),
              "attestation_url": os.environ.get("ATTESTATION_URL"),
              "bundle_path": os.environ.get("BUNDLE_PATH"),
              "verified_with_gh_cli": True,
              "provenance": "sigstore-slsa-github-actions",
          }
          Path("/tmp/attest-subjects/PROVENANCE-RECEIPT.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload provenance bundle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-provenance-${{ github.run_id }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            /tmp/attest-subjects/SHA256SUMS
            /tmp/attest-subjects/PROVENANCE-RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [verify, verify-consolidated-package, attest-wheels]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release publication policy
        run: python scripts/check_release_publish_policy.py
      - name: Resolve release metadata and notes
        id: release
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          policy = json.loads(Path("release-policy.v1.json").read_text(encoding="utf-8"))
          version = policy["version"]
          tag = policy["tag"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          pattern = re.compile(rf"^## {re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}$")
          starts = [index for index, line in enumerate(changelog) if pattern.fullmatch(line)]
          assert len(starts) == 1, f"expected one changelog section for {version}"
          start = starts[0] + 1
          end = len(changelog)
          for index in range(start, len(changelog)):
              if changelog[index].startswith("## "):
                  end = index
                  break
          notes = "\n".join(changelog[start:end]).strip() + "\n"
          assert notes.strip(), "release notes are empty"
          Path("/tmp/release-notes.md").write_text(notes, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
          PY
      - name: Check whether immutable release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download canonical wheel assets
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheel-py3.11"
          path: /tmp/release-wheels
          merge-multiple: true
          digest-mismatch: error
      - name: Download signed provenance asset
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-provenance-${{ github.run_id }}
          path: /tmp/release-provenance
          digest-mismatch: error
      - name: Prepare immutable release assets
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "$(find /tmp/release-wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 10
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import shutil
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          wheels_dir = Path("/tmp/release-wheels")
          provenance_dir = Path("/tmp/release-provenance")
          assets_dir = Path("/tmp/release-assets")
          assets_dir.mkdir(parents=True, exist_ok=True)
          wheels = sorted(wheels_dir.glob("*.whl"))
          assert len(wheels) == 10, f"expected ten canonical wheels; found {len(wheels)}"

          sums_files = list(provenance_dir.rglob("SHA256SUMS"))
          assert len(sums_files) == 1, f"expected one provenance SHA256SUMS; found {len(sums_files)}"
          sums_file = sums_files[0]
          expected = {}
          for raw in sums_file.read_text(encoding="utf-8").splitlines():
              digest, name = raw.split("  ", 1)
              expected[name] = digest
          assert len(expected) == 10, f"expected ten provenance wheel digests; found {len(expected)}"
          assert set(expected) == {wheel.name for wheel in wheels}, "release wheel names differ from provenance subjects"

          observed = {}
          for wheel in wheels:
              digest = sha256(wheel.read_bytes()).hexdigest()
              assert digest == expected[wheel.name], f"wheel digest mismatch for {wheel.name}"
              observed[wheel.name] = digest
              shutil.copy2(wheel, assets_dir / wheel.name)
          shutil.copy2(sums_file, assets_dir / "SHA256SUMS")

          provenance_zip = assets_dir / f"promptops-{os.environ['VERSION']}-provenance.zip"
          with ZipFile(provenance_zip, "w") as archive:
              for path in sorted(item for item in provenance_dir.rglob("*") if item.is_file()):
                  info = ZipInfo(path.relative_to(provenance_dir).as_posix(), (1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, path.read_bytes())

          receipt = {
              "schema_version": "1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG"],
              "source_digest": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "canonical_wheel_count": len(observed),
              "canonical_wheel_python_source": "3.11",
              "wheel_sha256": dict(sorted(observed.items())),
              "sha256sums_sha256": sha256((assets_dir / "SHA256SUMS").read_bytes()).hexdigest(),
              "provenance_zip": provenance_zip.name,
              "provenance_zip_sha256": sha256(provenance_zip.read_bytes()).hexdigest(),
              "publication": "github-release-owner-main-after-signed-provenance",
          }
          (assets_dir / "RELEASE-RECEIPT.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          assert len(list(assets_dir.iterdir())) == 13, "expected 13 immutable release assets"
          PY
      - name: Publish GitHub Release once
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PromptOps $VERSION" \
            --notes-file /tmp/release-notes.md \
            /tmp/release-assets/*
      - name: Read back and verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_WAS_EXISTING: ${{ steps.existing.outputs.exists }}
        run: |
          rm -rf /tmp/release-readback
          mkdir -p /tmp/release-readback
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url > /tmp/release-view.json
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/release-readback
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          view = json.loads(Path("/tmp/release-view.json").read_text(encoding="utf-8"))
          assert view["tagName"] == os.environ["TAG"], "release tag mismatch"
          assert view["isDraft"] is False, "release must not be draft"
          assert view["isPrerelease"] is False, "release must not be prerelease"

          directory = Path("/tmp/release-readback")
          receipt_path = directory / "RELEASE-RECEIPT.json"
          assert receipt_path.is_file(), "release receipt asset is missing"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          assert receipt["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["version"] == os.environ["VERSION"]
          assert receipt["tag"] == os.environ["TAG"]
          assert receipt["canonical_wheel_count"] == 10
          assert receipt["canonical_wheel_python_source"] == "3.11"
          if os.environ["RELEASE_WAS_EXISTING"] != "true":
              assert receipt["source_digest"] == os.environ["GITHUB_SHA"], "new release source SHA mismatch"

          wheel_sha256 = receipt["wheel_sha256"]
          assert isinstance(wheel_sha256, dict) and len(wheel_sha256) == 10
          for name, expected in wheel_sha256.items():
              path = directory / name
              assert path.is_file(), f"release wheel asset missing: {name}"
              assert sha256(path.read_bytes()).hexdigest() == expected, f"release wheel digest mismatch: {name}"

          sums = directory / "SHA256SUMS"
          assert sums.is_file(), "release SHA256SUMS is missing"
          assert sha256(sums.read_bytes()).hexdigest() == receipt["sha256sums_sha256"]
          parsed = {}
          for raw in sums.read_text(encoding="utf-8").splitlines():
              digest, name = raw.split("  ", 1)
              parsed[name] = digest
          assert parsed == wheel_sha256, "release SHA256SUMS differs from receipt"

          provenance = directory / receipt["provenance_zip"]
          assert provenance.is_file(), "release provenance ZIP is missing"
          assert sha256(provenance.read_bytes()).hexdigest() == receipt["provenance_zip_sha256"]

          expected_names = set(wheel_sha256) | {
              "SHA256SUMS",
              receipt["provenance_zip"],
              "RELEASE-RECEIPT.json",
          }
          observed_names = {path.name for path in directory.iterdir() if path.is_file()}
          assert observed_names == expected_names, (
              f"release asset set mismatch: expected={sorted(expected_names)} observed={sorted(observed_names)}"
          )
          print(f"immutable GitHub Release verified: {view['url']}")
          PY
